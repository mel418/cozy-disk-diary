<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cozy Disk Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#F4C6CD; --peach:#F5C6A2; --cream:#F8E6C6; --beige:#E9D5B7; --sage:#B7C9A3;
  --mint:#C7DECF; --blue:#B9DDE5; --lav:#D5C5E8; --brown:#675348; --char:#4C5147;
  --paper:#FFF9EE; --line:#675348;
  --ink:#675348;            /* text that sits on pastel fills (always dark) */
  --bg:#fbe3e6; --grid:#F4C6CD; --card:#fff; --rule:#E9D5B7; --hover:#fff6f0; --sel:#f0e9f7;
  --c-pink:#fdeaed; --c-blue:#e8f4f7; --c-mint:#e8f2ec; --c-lav:#f0e9f7; --shadow:#F5C6A2;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --brown:#f1e4dc; --char:#d8c9c2;           /* text on dark surfaces */
  --paper:#2d2533; --cream:#3a3041; --beige:#4a3f52; --line:#cdaebb;
  --bg:#1f1a25; --grid:#2b2332; --card:#382f3f; --rule:#4d4256; --hover:#443949; --sel:#4a3d57;
  --c-pink:#4a3340; --c-blue:#2f4048; --c-mint:#31423a; --c-lav:#41365a; --shadow:#5a4350;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Nunito',system-ui,sans-serif;color:var(--brown);
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;padding:20px 16px}
.pixel{font-family:'VT323',monospace;letter-spacing:.5px}
.window{max-width:1180px;margin:0 auto;background:var(--paper);border:2px solid var(--line);border-radius:14px;
  box-shadow:6px 6px 0 var(--shadow);overflow:hidden}
.titlebar{display:flex;align-items:center;gap:10px;background:var(--pink);color:var(--ink);border-bottom:2px solid var(--line);padding:6px 12px}
.titlebar .t{flex:1;font-size:22px}
.sq{width:16px;height:16px;border:2px solid var(--line);background:var(--cream);border-radius:3px;display:inline-block}
.body{display:grid;grid-template-columns:190px 1fr;min-height:620px}
nav{background:var(--cream);border-right:2px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:8px}
nav button{font:inherit;font-weight:800;text-align:left;border:2px solid transparent;background:transparent;color:var(--brown);
  padding:9px 12px;border-radius:999px;cursor:pointer;transition:transform .15s}
nav button:hover{transform:translateX(3px);background:var(--paper)}
nav button.on{background:var(--lav);border-color:var(--line);color:var(--ink)}
nav .tip{margin-top:auto;font-size:13px;background:var(--paper);border:2px dashed var(--sage);border-radius:12px;padding:10px;line-height:1.35}
main{padding:20px 22px;min-width:0}
h1{margin:0 0 4px;font-size:26px} h2{margin:0 0 10px;font-size:18px}
.sub{color:var(--char);margin:0 0 16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.card.pink{background:var(--c-pink)}.card.blue{background:var(--c-blue)}.card.mint{background:var(--c-mint)}.card.lav{background:var(--c-lav)}.card.cream{background:var(--cream)}
.themebtn{font:inherit;font-size:15px;line-height:1;border:2px solid var(--line);background:var(--cream);color:var(--ink);border-radius:999px;padding:2px 10px;cursor:pointer}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.btn{font:inherit;font-weight:800;color:var(--ink);background:var(--peach);border:2px solid var(--line);border-radius:999px;
  padding:7px 16px;cursor:pointer;box-shadow:0 3px 0 var(--line);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px);box-shadow:0 5px 0 var(--line)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.small{padding:3px 11px;font-size:13px;background:var(--blue)}
.btn:disabled{opacity:.5;cursor:default}
input[type=text]{font:inherit;border:2px solid var(--line);border-radius:999px;padding:7px 14px;background:var(--paper);color:var(--brown);min-width:240px;flex:1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{height:14px;background:var(--cream);border:2px solid var(--line);border-radius:999px;overflow:hidden;display:flex}
.bar>i{display:block;height:100%}
.chip{color:var(--ink);display:inline-block;border:2px solid var(--line);border-radius:999px;padding:1px 10px;font-size:13px;font-weight:800;margin:2px 4px 2px 0}
.pet{display:flex;gap:14px;align-items:center}
.pet svg{flex:none;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.big{font-size:34px}
.kid{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:14px;
  padding:10px 14px;margin-bottom:10px;cursor:pointer;transition:transform .15s,background .15s}
.kid:hover{transform:translateY(-2px);background:var(--hover)}
.kid.sel{background:var(--sel)}
.kid .top{display:flex;justify-content:space-between;gap:10px;font-weight:800}
.kid .top span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kid small{color:var(--char)}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px;font-weight:800}
.crumbs button{font:inherit;font-weight:800;border:2px solid var(--line);background:var(--blue);border-radius:999px;padding:1px 10px;cursor:pointer;color:var(--ink)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
table{width:100%;border-collapse:collapse}
td,th{padding:6px 4px;text-align:left;border-bottom:1px dashed var(--rule);font-size:14px}
td.r,th.r{text-align:right;white-space:nowrap}
.path{word-break:break-all;font-size:13px}
.up{color:#b0524a}.down{color:#4f7f5c}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;margin-top:8px}
.dot{display:inline-block;width:11px;height:11px;border:2px solid var(--line);border-radius:50%;margin-right:4px;vertical-align:-1px}
.empty{text-align:center;padding:30px 10px}
.toast{color:#b0524a;font-weight:800;margin-top:8px}
.prog{background:repeating-linear-gradient(45deg,var(--pink),var(--pink) 10px,var(--cream) 10px,var(--cream) 20px);background-size:200% 100%;animation:slide 1s linear infinite;width:100%;height:100%}
@keyframes slide{to{background-position:28px 0}}
.fold>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:'▾';font-weight:800;transition:transform .15s}
.fold:not([open])>summary::before{transform:rotate(-90deg)}
.fold>summary h2{margin:0;flex:1}
.fold[open]>summary{margin-bottom:10px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
input[type=text]:focus-visible,select:focus-visible{outline-color:var(--lav)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar input[type=text]{min-width:160px;max-width:260px}
select.btn{box-shadow:none;padding:5px 12px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{font:inherit;font-weight:800;font-size:13px;border:0;background:var(--paper);color:var(--brown);padding:4px 12px;cursor:pointer}
.seg button.on{background:var(--lav);color:var(--ink)}
.seg button+button{border-left:2px solid var(--line)}
.fchips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.fchip{font:inherit;font-size:12px;font-weight:800;color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:1px 10px;cursor:pointer}
.fchip.on{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--line)}
.kids.gridv{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.kids.gridv .kid{margin:0}
.kids.gridv .kid .top{flex-direction:column;gap:2px}
.kids.listv .kid{padding:7px 12px;margin-bottom:6px}
.kid .bar{height:10px}
.kid .ic{font-size:20px}
.tile{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--rule)}
.tile:last-child{border-bottom:0}
.tile .ft{flex:none;width:34px;height:34px;border:2px solid var(--line);border-radius:10px;display:grid;place-items:center;font-size:18px}
.tile .nm{flex:1;min-width:0}
.tile .nm b,.tile .nm small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn.tiny{padding:1px 9px;font-size:12px;background:var(--blue);box-shadow:0 2px 0 var(--line);flex:none}
.health{display:flex;align-items:center;gap:8px;font-weight:800}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fde0dc;color:#7a3029;border:2px solid #b0524a;border-radius:14px;padding:10px 14px;margin-bottom:14px;font-weight:800}
:root[data-theme="dark"] .banner{background:#4a2b2b;color:#f6c9c4}
.snackbar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--brown);color:var(--paper);padding:8px 18px;border-radius:999px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.snackbar.show{opacity:1}
.skel{height:64px;border-radius:14px;margin-bottom:10px;background:linear-gradient(90deg,var(--cream),var(--paper),var(--cream));background-size:200% 100%;animation:slide 1.2s linear infinite}
@media(max-width:820px){.body{grid-template-columns:1fr}nav{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:2px solid var(--line)}nav .tip{display:none}.cols{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="window">
  <div class="titlebar"><span class="sq"></span><span class="t pixel">♡ cozy_disk_diary.exe</span><button class="themebtn" id="themebtn" title="Switch light / dark mode" aria-label="Switch light or dark mode">🌙</button><span class="sq"></span><span class="sq"></span></div>
  <div class="body">
    <nav>
      <button data-tab="home" class="on">🏡 Home</button>
      <button data-tab="folders">📁 My Folders</button>
      <button data-tab="changes">📖 Change Log</button>
      <div class="tip">✨ Everything here is <b>look-only</b>. Nothing gets deleted or changed on your computer.</div>
    </nav>
    <main id="main"></main>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS = {pictures:'#F4C6CD',videos:'#D5C5E8',music:'#B9DDE5',documents:'#F5C6A2',code:'#C7DECF',archives:'#B7C9A3',apps:'#E9D5B7',other:'#F8E6C6'};
const NAMES = {pictures:'Pictures',videos:'Videos',music:'Music',documents:'Documents',code:'Code & data',archives:'Zips & disc images',apps:'Apps & system',other:'Other things'};
const fmt = b => { b=Math.abs(b); if(b<1024) return b+' B'; const u=['KB','MB','GB','TB']; let i=-1; do{b/=1024;i++}while(b>=1024&&i<3); return b.toFixed(b<10?2:1)+' '+u[i]; };
const sgn = d => (d>0?'+':d<0?'−':'')+fmt(d);
const ago = t => { if(!t) return 'unknown'; const d=(Date.now()/1000-t)/86400; return d<1?'today':d<2?'yesterday':d<60?Math.round(d)+' days ago':d<700?Math.round(d/30)+' months ago':Math.round(d/365)+' years ago'; };
const when = t => new Date(t*1000).toLocaleString([], {dateStyle:'medium',timeStyle:'short'});
const api = (u,body) => fetch(u, body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:undefined).then(r=>r.json());
const ICONS = {pictures:'🖼️',videos:'🎬',music:'🎵',documents:'📄',code:'💻',archives:'📦',apps:'⚙️',other:'📎'};
const catOf = p => { const e=(p.match(/\.[^.\\\/]+$/)||[''])[0].toLowerCase(); return CAT_EXT[e]||'other'; };
const CAT_EXT = {pictures:'.jpg .jpeg .png .gif .bmp .webp .heic .svg .tif .tiff .raw .psd .ico',videos:'.mp4 .mkv .mov .avi .wmv .flv .webm .m4v',music:'.mp3 .wav .flac .aac .ogg .m4a .wma',documents:'.pdf .doc .docx .xls .xlsx .ppt .pptx .txt .md .csv .rtf .odt .epub',code:'.py .js .ts .html .css .json .java .c .cpp .h .cs .go .rs .php .rb .sh .bat .ps1 .xml .yml .yaml',archives:'.zip .rar .7z .tar .gz .iso .bz2 .cab',apps:'.exe .dll .msi .sys .lib .pdb .apk'};
Object.assign(CAT_EXT, Object.fromEntries(Object.entries(CAT_EXT).flatMap(([c,s])=>s.split(' ').map(e=>[e,c]))));
let snackT;
function snack(msg){ let s=$('#snack'); if(!s){ s=document.createElement('div'); s.id='snack'; s.className='snackbar'; s.setAttribute('role','status'); document.body.appendChild(s); }
  s.textContent=msg; s.classList.add('show'); clearTimeout(snackT); snackT=setTimeout(()=>s.classList.remove('show'),1800); }
function copyPath(p){ (navigator.clipboard?navigator.clipboard.writeText(p):Promise.reject()).then(()=>snack('Path copied ♡'),()=>snack('Couldn\'t copy — select it by hand')); }
function fileName(p){ return p.split(/[\\\/]/).filter(Boolean).pop()||p; }

let tab='home', root=null, path=null, polling=null;
const view = {mode:'list', sort:'size', q:'', cat:null, more:false};
try{ view.mode=localStorage.getItem('viewmode')||'list'; }catch(e){}
const hist = {drives:[],home:''};

document.querySelectorAll('nav button').forEach(b => b.onclick = () => go(b.dataset.tab));
function go(t){ tab=t; document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t)); render(); }

function bunny(mood){
  const mouth = mood==='happy'?'M44 62 Q50 69 56 62':mood==='ok'?'M45 64 H55':'M44 67 Q50 60 56 67';
  const cheek = mood==='worried'?'#F5C6A2':'#F4C6CD';
  return `<svg width="100" height="110" viewBox="0 0 100 110" aria-hidden="true">
    <ellipse cx="34" cy="26" rx="9" ry="22" fill="#fff" stroke="#675348" stroke-width="2.5"/><ellipse cx="34" cy="28" rx="4" ry="14" fill="#F4C6CD"/>
    <ellipse cx="66" cy="26" rx="9" ry="22" fill="#fff" stroke="#675348" stroke-width="2.5"/><ellipse cx="66" cy="28" rx="4" ry="14" fill="#F4C6CD"/>
    <ellipse cx="50" cy="66" rx="36" ry="32" fill="#fff" stroke="#675348" stroke-width="2.5"/>
    <circle cx="38" cy="54" r="3.5" fill="#675348"/><circle cx="62" cy="54" r="3.5" fill="#675348"/>
    <ellipse cx="30" cy="63" rx="6" ry="4" fill="${cheek}"/><ellipse cx="70" cy="63" rx="6" ry="4" fill="${cheek}"/>
    <path d="${mouth}" fill="none" stroke="#675348" stroke-width="2.5" stroke-linecap="round"/></svg>`;
}
function greet(){ const h=new Date().getHours(); return h<12?'Good morning':h<18?'Good afternoon':'Good evening'; }

async function render(){
  const m = $('#main');
  try{
    if(tab==='home') return await renderHome(m);
    if(tab==='folders') return await renderFolders(m);
    if(tab==='changes') return await renderChanges(m);
  }catch(e){
    m.innerHTML=`<div class="banner" role="alert">😿 Couldn't reach the diary just now. <button class="btn small" id="retry">Try again</button></div>`;
    $('#retry').onclick=render;
  }
}

/* ---------------------------------------------------------------- home */
async function renderHome(m){
  const [d, st, h] = await Promise.all([api('/api/drives'), api('/api/status'), api('/api/history')]);
  hist.drives=d.drives; hist.home=d.home;
  if(!root && h.length) root=h[0].root;
  const driveCards = d.drives.map(x=>{
    const pct = x.used/x.total*100, freePct = x.free/x.total*100;
    const mood = freePct>30?'happy':freePct>10?'ok':'worried';
    const say = mood==='happy'?'Lots of cozy room left!':mood==='ok'?'Getting a little snug…':'It\'s really full — time for a tidy!';
    return `<div class="card pink"><div class="pet">${bunny(mood)}<div style="flex:1;min-width:0">
      <h2 class="pixel big" style="margin:0">Drive ${esc(x.path)}</h2>
      <div class="bar" style="margin:6px 0"><i style="width:${pct}%;background:${pct>90?'#e59a9a':'var(--sage)'}"></i></div>
      <div><b>${fmt(x.used)}</b> used of ${fmt(x.total)} · <b>${fmt(x.free)}</b> free</div>
      <div style="margin-top:4px">${say}</div></div></div></div>`;
  }).join('');
  const last = h[0];
  const badges = [
    [h.length>=1,'🌱 First scan'],[h.length>=3,'📚 Three diary entries'],[h.length>=7,'🏆 Diary keeper'],
  ].map(([on,t])=>`<span class="chip" style="background:${on?'var(--mint)':'#eee;opacity:.5'}">${t}</span>`).join('');
  let ins=null;
  if(root){ try{ ins=await api('/api/insights?root='+encodeURIComponent(root)); }catch(e){} }
  let tidy='';
  if(ins && !ins.empty && (ins.big_files.length||ins.stale.length)){
    const bf=ins.big_files.slice(0,5).map(f=>`<div class="tile"><span class="ft" style="background:${COLORS[catOf(f.path)]};color:var(--ink)">${ICONS[catOf(f.path)]}</span>
      <div class="nm"><b title="${esc(f.path)}">${esc(fileName(f.path))}</b><small>${esc(f.path)}</small></div><b>${fmt(f.size)}</b>
      <button class="btn tiny" data-copy="${esc(f.path)}" aria-label="Copy path of ${esc(fileName(f.path))}">Copy path</button></div>`).join('');
    const st=ins.stale.map(f=>`<div class="tile"><span class="ft" style="background:var(--lav);color:var(--ink)">🧺</span>
      <div class="nm"><b title="${esc(f.path)}">${esc(fileName(f.path))}</b><small>Untouched for ${ago(f.newest).replace(' ago','')} · ${esc(f.path)}</small></div><b>${fmt(f.size)}</b>
      <button class="btn tiny" data-open="${esc(f.path)}">Show 🗂</button></div>`).join('');
    tidy=`<div class="card mint"><h2>🧹 Tidy-up ideas <small style="font-weight:600">from your latest scan of ${esc(ins.root)}</small></h2>
      <div class="grid2"><div><b>🐘 Biggest files</b>${bf||'<p class="sub">None found.</p>'}</div>
      <div><b>🧺 Forgotten for a year+</b>${st||'<p class="sub">Nothing big has been forgotten — nice! ✨</p>'}</div></div>
      <p class="sub" style="margin:8px 0 0"><small>These are just suggestions — this app never deletes anything. Use “Show” to peek in Explorer and decide yourself.</small></p></div>`;
  }
  m.innerHTML = `<h1>${greet()}, lovely ♡</h1>
    <p class="sub">Let's see where your space went today.</p>
    <div class="grid2">${driveCards}</div>${tidy}
    <div class="card blue"><h2>🔍 Scan a spot</h2>
      <p class="sub" style="margin-bottom:10px">Pick a drive or folder to look through. Bigger places take longer — your home folder is a great start.</p>
      <div class="row" id="quick"></div>
      <div class="row" style="margin-top:10px"><input type="text" id="scanpath" placeholder="e.g. C:\\Users\\you\\Downloads" value="${esc(d.home)}">
        <button class="btn" id="scanbtn">Scan ✿</button></div>
      <div id="scanmsg"></div></div>
    <div class="card cream"><h2>🏅 Diary badges</h2>${badges}
      <p class="sub" style="margin:8px 0 0">${last?`Last scan: <b>${esc(last.root)}</b> · ${fmt(last.total)} · ${when(last.time)}`:'No scans yet — your first one unlocks a badge!'}</p></div>`;
  const q=$('#quick');
  [...d.drives.map(x=>x.path),d.home,d.home+'\\Downloads',d.home+'\\Documents',d.home+'\\Desktop',d.home+'\\Pictures'].forEach(p=>{
    const b=document.createElement('button'); b.className='btn small'; b.textContent=p.length>22?'…'+p.slice(-20):p; b.onclick=()=>$('#scanpath').value=p; q.appendChild(b);});
  m.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyPath(b.dataset.copy));
  m.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>api('/api/open',{path:b.dataset.open}).then(r=>{ if(!r.ok) snack('That folder can\'t be opened'); }));
  const doScan = async()=>{
    const r=await api('/api/scan',{path:$('#scanpath').value.trim()});
    if(!r.ok){ $('#scanmsg').innerHTML=`<div class="banner" role="alert" style="margin:10px 0 0">${esc(r.msg)}. <button class="btn small" id="rescan">Retry</button></div>`; $('#rescan').onclick=doScan; return; }
    poll();
  };
  $('#scanbtn').onclick = doScan;
  $('#scanpath').onkeydown = e=>{ if(e.key==='Enter') doScan(); };
  if(st.running) poll();
}
function poll(){
  clearInterval(polling);
  const tick = async()=>{
    const st = await api('/api/status'); const box=$('#scanmsg');
    if(st.running){
      if(box && tab==='home'){ box.innerHTML=`<div class="card mint" style="margin:12px 0 0"><b>Tiptoeing through ${esc(st.root)} …</b>
        <div class="bar" style="margin:8px 0"><div class="prog"></div></div>
        <small>${st.files.toLocaleString()} files peeked at · ${st.elapsed}s<br><span class="path">${esc(st.current)}</span></small></div>`;
        $('#scanbtn') && ($('#scanbtn').disabled=true); }
    } else {
      clearInterval(polling);
      if(st.error && box){ box.innerHTML=`<div class="banner" role="alert" style="margin:10px 0 0">Oops: ${esc(st.error)} <button class="btn small" id="rescan">Retry</button></div>`; $('#scanbtn')&&($('#scanbtn').disabled=false); $('#rescan').onclick=()=>$('#scanbtn').click(); }
      else if(st.root){ root=st.root; path=st.root; if(tab==='home') box && (box.innerHTML=`<div class="card mint" style="margin:12px 0 0">✨ All done! <button class="btn small" onclick="go('folders')">See my folders</button></div>`), $('#scanbtn') && ($('#scanbtn').disabled=false), setTimeout(()=>tab==='home'&&renderHome($('#main')).then(()=>{}),0); }
    }
  };
  polling=setInterval(tick,1000); tick();
}

/* -------------------------------------------------------------- folders */
async function renderFolders(m){
  const h = await api('/api/history');
  if(!h.length){ m.innerHTML=`<div class="empty card cream">${bunny('ok')}<h2>Nothing scanned yet</h2><p>Head Home and scan a folder first ♡</p><button class="btn" onclick="go('home')">Take me home</button></div>`; return; }
  if(!root) root=h[0].root;
  if(!path) path=root;
  const r = await api('/api/folder?root='+encodeURIComponent(root)+'&path='+encodeURIComponent(path));
  if(r.missing){ path=root; return renderFolders(m); }
  const n=r.node;
  const roots=[...new Set(h.map(x=>x.root))];
  // breadcrumbs
  const parts=[]; let p=n.path;
  while(true){ parts.unshift(p); if(p.toLowerCase()===root.toLowerCase()) break; const up=p.replace(/[\\\/][^\\\/]*$/,''); if(!up||up===p||up.length<root.length) break; p=up; }
  const crumbs=parts.map((c,i)=>`<button data-p="${esc(c)}">${esc((i===0?'🏠 ':'')+(c.split(/[\\\/]/).filter(Boolean).pop()||c))}</button>`).join(' › ');
  const cats = Object.entries(n.cats).sort((a,b)=>b[1].s-a[1].s);
  if(view.cat && !n.cats[view.cat]) view.cat=null;
  const kidsHtml = () => {
    const q=view.q.trim().toLowerCase();
    let list=n.children.filter(c=>(!q||c.name.toLowerCase().includes(q)) && (!view.cat||c.cats[view.cat]));
    list.sort(view.sort==='name'?(a,b)=>a.name.localeCompare(b.name):view.sort==='files'?(a,b)=>b.files-a.files:(a,b)=>(view.cat?(b.cats[view.cat]||0)-(a.cats[view.cat]||0):b.size-a.size));
    const total=list.length; if(!view.more) list=list.slice(0,40);
    if(!total) return `<p class="sub">${n.children.length?'No folders match — try clearing the search or filter ✿':'No big sub-folders here — it\'s just files ✿'}</p>`;
    const items=list.map(c=>{
      const pct = n.size?c.size/n.size*100:0;
      const segs=Object.entries(c.cats).sort((a,b)=>b[1]-a[1]).map(([k,s])=>`<i style="width:${c.size?s/c.size*100:0}%;background:${COLORS[k]}" title="${NAMES[k]}: ${fmt(s)}"></i>`).join('');
      return `<button class="kid" data-p="${esc(c.path)}" title="${esc(c.path)}"><div class="top"><span><span class="ic">📁</span> ${esc(c.name)}</span><span>${fmt(c.size)}</span></div>
        <div class="bar" style="margin:6px 0 2px;width:${Math.max(c.size/(n.children[0]?.size||1)*100,10)}%" aria-hidden="true">${segs}</div><small>${pct.toFixed(1)}% of this folder · ${c.files.toLocaleString()} files</small></button>`;
    }).join('');
    return items + (total>list.length?`<button class="btn small" id="showmore">Show all ${total} folders</button>`:'');
  };
  const top = cats[0];
  const summary = n.size===0?'This folder is empty.':
    `Mostly <b>${NAMES[top[0]].toLowerCase()}</b> (${fmt(top[1].s)} of ${fmt(n.size)}). Holds ${n.files.toLocaleString()} files. Something in here changed <b>${ago(n.newest)}</b>.`;
  const stack = cats.map(([k,v])=>`<i style="width:${n.size?v.s/n.size*100:0}%;background:${COLORS[k]}" title="${NAMES[k]}"></i>`).join('');
  const rows = cats.map(([k,v])=>`<tr><td><span class="dot" style="background:${COLORS[k]}"></span>${NAMES[k]}</td><td class="r">${v.n.toLocaleString()} files</td><td class="r"><b>${fmt(v.s)}</b></td></tr>`).join('');
  const tops = n.top.map(t=>{ const k=catOf(t.path); return `<div class="tile"><span class="ft" style="background:${COLORS[k]};color:var(--ink)" title="${NAMES[k]}">${ICONS[k]}</span>
    <div class="nm"><b title="${esc(t.path)}">${esc(fileName(t.path))}</b><small>${esc(t.path.slice(n.path.length).replace(/^[\\\/]/,'')||t.path)}</small></div><b>${fmt(t.size)}</b>
    <button class="btn tiny" data-copy="${esc(t.path)}" aria-label="Copy path of ${esc(fileName(t.path))}">Copy</button></div>`; }).join('');
  const fchips = cats.map(([k,v])=>`<button class="fchip ${view.cat===k?'on':''}" data-cat="${k}" style="background:${COLORS[k]}" aria-pressed="${view.cat===k}">${ICONS[k]} ${NAMES[k]}</button>`).join('');
  m.innerHTML = `<div class="row" style="justify-content:space-between"><h1 style="margin:0">My Folders</h1>
      <select id="rootsel" class="btn small" style="max-width:260px">${roots.map(x=>`<option ${x===root?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
    <p class="sub">Scanned ${when(r.snap.time)} · tap a folder to peek inside</p>
    <div class="crumbs" role="group" aria-label="Folder path">${crumbs}</div>
    <div class="cols"><div>
      <div class="toolbar"><input type="text" id="fq" placeholder="🔍 Search folders…" aria-label="Search folders" value="${esc(view.q)}">
        <select id="fsort" class="btn small" aria-label="Sort folders"><option value="size">Biggest first</option><option value="files">Most files</option><option value="name">A → Z</option></select>
        <div class="seg" role="group" aria-label="View"><button data-mode="list" class="${view.mode==='list'?'on':''}">☰ List</button><button data-mode="gridv" class="${view.mode==='gridv'?'on':''}">▦ Grid</button></div></div>
      <div class="fchips" aria-label="Filter by file type">${fchips}</div>
      <div id="kids" class="kids ${view.mode==='gridv'?'gridv':'listv'}">${kidsHtml()}</div></div>
      <div><div class="card lav"><h2 class="pixel big" style="margin:0">${esc(n.name)}</h2>
        <div class="big pixel" style="color:var(--brown)">${fmt(n.size)}</div><p style="margin:4px 0 10px">${summary}</p>
        <div class="bar">${stack}</div>
        <table style="margin-top:8px">${rows}</table>
        <div class="row" style="margin-top:10px"><button class="btn small" id="openbtn">Show in Explorer 🗂</button></div></div>
        ${n.top.length?`<div class="card mint"><h2>🐘 Biggest files</h2>${tops}</div>`:''}
        ${n.loose>0?`<div class="card cream"><small>${fmt(n.loose)} sits loose in this folder (files directly here and tiny sub-folders).</small></div>`:''}</div></div>`;
  const wire = () => {
    m.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{path=b.dataset.p;view.q='';view.more=false;renderFolders(m);});
    const sm=$('#showmore'); if(sm) sm.onclick=()=>{view.more=true;redraw();};
  };
  const redraw = () => { $('#kids').innerHTML=kidsHtml(); wire(); };
  wire();
  m.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyPath(b.dataset.copy));
  $('#fq').oninput=e=>{view.q=e.target.value;redraw();};
  $('#fsort').value=view.sort; $('#fsort').onchange=e=>{view.sort=e.target.value;redraw();};
  m.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{view.mode=b.dataset.mode;try{localStorage.setItem('viewmode',view.mode);}catch(e){}renderFolders(m);});
  m.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{view.cat=view.cat===b.dataset.cat?null:b.dataset.cat;renderFolders(m);});
  $('#rootsel').onchange=e=>{root=e.target.value;path=root;renderFolders(m);};
  $('#openbtn').onclick=()=>api('/api/open',{path:n.path}).then(r=>{ if(!r.ok) snack('That folder can\'t be opened'); });
}

/* -------------------------------------------------------------- changes */
async function renderChanges(m){
  const h = await api('/api/history');
  if(!h.length){ m.innerHTML=`<div class="empty card cream">${bunny('ok')}<h2>The diary is blank</h2><p>Scan something to write the first page ♡</p><button class="btn" onclick="go('home')">Take me home</button></div>`; return; }
  if(!root) root=h[0].root;
  const r = await api('/api/changes?root='+encodeURIComponent(root));
  const roots=[...new Set(h.map(x=>x.root))];
  const mine=h.filter(x=>x.root===root);
  const entries = mine.map((x,i)=>{ const prev=mine[i+1];
    return `<tr><td>${when(x.time)}</td><td class="r"><b>${fmt(x.total)}</b></td><td class="r ${prev?(x.total>prev.total?'up':'down'):''}">${prev?sgn(x.total-prev.total):'first page ✿'}</td></tr>`; }).join('');
  let changes;
  if(r.need_more) changes=`<div class="empty card cream">${bunny('ok')}<h2>Scan one more time!</h2><p>The change log compares two scans. Scan this folder again later and I'll tell you what grew, shrank, or appeared ♡</p></div>`;
  else if(r.error) changes=`<div class="toast">${esc(r.error)}</div>`;
  else {
    const rows = r.rows.map(x=>`<tr><td><span class="chip" style="background:${x.delta>0?'var(--pink)':'var(--mint)'}">${x.kind}</span></td>
      <td class="path">${esc(x.path)}</td><td class="r ${x.delta>0?'up':'down'}"><b>${sgn(x.delta)}</b></td></tr>`).join('') || '<tr><td>Nothing changed by more than 1 MB — so peaceful ☁️</td></tr>';
    changes=`<details class="card pink fold" open><summary><h2>What changed since ${when(r.old.time)}? <small>(${r.rows.length})</small></h2></summary>
      <p>Total went from <b>${fmt(r.old.total)}</b> to <b>${fmt(r.new.total)}</b> (<b class="${r.total_delta>0?'up':'down'}">${sgn(r.total_delta)}</b>)</p>
      <table>${rows}</table><p class="sub" style="margin-top:8px"><small>Only changes over 1 MB are listed, and I show the specific folder responsible.</small></p></details>`;
  }
  m.innerHTML = `<div class="row" style="justify-content:space-between"><h1 style="margin:0">Change Log</h1>
      <select id="rootsel" class="btn small" style="max-width:260px">${roots.map(x=>`<option ${x===root?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
    <p class="sub">A diary of every scan, and what changed in between.</p>${changes}
    <details class="card blue fold" open><summary><h2>📜 Scan history <small>(${mine.length})</small></h2></summary><table><tr><th>When</th><th class="r">Total</th><th class="r">Change</th></tr>${entries}</table></details>`;
  $('#rootsel').onchange=e=>{root=e.target.value;path=root;renderChanges(m);};
}

/* ---------------------------------------------------------- dark mode */
function setTheme(t, save){
  document.documentElement.dataset.theme = t;
  $('#themebtn').textContent = t==='dark' ? '☀️' : '🌙';
  if(save){ try{ localStorage.setItem('theme', t); }catch(e){} }
}
(function(){
  let t=null; try{ t=localStorage.getItem('theme'); }catch(e){}
  if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  setTheme(t,false);
  $('#themebtn').onclick = () => setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark', true);
})();

render();
</script>
</body>
</html>
